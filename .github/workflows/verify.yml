name: TinyKernel Verify

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install native dependencies
        run: sudo apt-get update && sudo apt-get install -y ninja-build libsqlite3-dev g++-14
      - name: Configure, build and verify
        env:
          CXX: g++-14
        run: ./bin/tinykernel verify
